<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
  <title>Жетіқарақшы — Сандық Саяхаты</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Мобильді браузердің артық қимылдарын шектеу */
    }

    body {
      background: #060919;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fef08a;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* Жоғарғы мәлімет панелі */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 19, 43, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
      white-space: nowrap;
      text-align: center;
    }

    /* Телефонға арналған ыңғайлы басқару батырмалары */
    .mobile-controls {
      position: absolute;
      bottom: 25px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(22, 30, 66, 0.8);
      border: 2px solid #fbbf24;
      color: #fde68a;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
      cursor: pointer;
    }
    .ctrl-btn:active {
      background: #fbbf24;
      color: #060919;
      transform: scale(0.95);
    }

    /* Жұлдыз туралы танымдық карта */
    #infoCard {
      position: absolute;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 17, 38, 0.9);
      backdrop-filter: blur(12px);
      border: 1.5px solid #fbbf24;
      border-radius: 14px;
      padding: 16px 20px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      display: none;
      z-index: 20;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.35);
    }
    #infoCard h3 {
      color: #fbbf24;
      font-size: 17px;
      margin-bottom: 6px;
    }
    #infoCard p {
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    #infoCard button {
      background: #fbbf24;
      border: none;
      color: #060919;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="top-bar">
    ✨ Зерттелгені: <span id="starCount" style="color: #38bdf8; font-weight: bold;">0 / 7</span>
  </div>

  <!-- Басу арқылы шығатын мәлімет карточкасы -->
  <div id="infoCard">
    <h3 id="cardTitle">Жұлдыз</h3>
    <p id="cardDesc">Сипаттамасы...</p>
    <button onclick="closeCard()">Жабу</button>
  </div>

  <!-- Құрылғыдан оңай басқару түймелері -->
  <div class="mobile-controls">
    <div class="btn-group">
      <div class="ctrl-btn" id="btnLeft">◄</div>
      <div class="ctrl-btn" id="btnRight">►</div>
    </div>
    <div class="btn-group">
      <div class="ctrl-btn" id="btnGas" style="width: 70px; border-radius: 20px;">ҰШУ</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const starCountEl = document.getElementById("starCount");
    const infoCard = document.getElementById("infoCard");
    const cardTitle = document.getElementById("cardTitle");
    const cardDesc = document.getElementById("cardDesc");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerConstellation();
    });

    // Қарапайым Сандық-кеме
    const ship = {
      x: width / 2,
      y: height / 2 + 120,
      angle: -Math.PI / 2,
      speed: 0,
      maxSpeed: 4,
      thrust: false,
      rotateLeft: false,
      rotateRight: false
    };

    // Қазақы таза атаулармен Жетіқарақшы координаталары (Экран ортасына қатысты)
    const starData = [
      { name: "1. Күш", dx: -120, dy: -10, desc: "Шөміштің шеткі басы. Қарақшылар тобының бас күзетшісі." },
      { name: "2. Жігер", dx: -130, dy: 70, desc: "Шөміштің түбі. Күшпен бірге Темірқазықты айнытпай көрсетеді." },
      { name: "3. Қайрат", dx: -30, dy: 80, desc: "Шөміш табағының мызғымас берік жұлдызы." },
      { name: "4. Қуат", dx: -20, dy: 0, desc: "Ожау мен сапты жалғап тұрған қуатты орталық түйін." },
      { name: "5. Ырық", dx: 60, dy: -30, desc: "Саптың бастауы, топтың ең жарық, жетекші жұлдызы." },
      { name: "6. Ерік", dx: 140, dy: -70, desc: "Сап ортасы. Қасында көз сынайтын кішкентай Балапан жұлдызы бар." },
      { name: "7. Дес (Шұнақ)", dx: 220, dy: -120, desc: "Саптың ең ұшы. Түн уақытын білдіретін аспан сағаты." }
    ];

    let stars = [];
    let visitedCount = 0;

    function centerConstellation() {
      const cx = width / 2;
      const cy = height / 2 - 30;
      stars = starData.map(s => ({
        ...s,
        x: cx + s.dx,
        y: cy + s.dy,
        visited: s.visited || false
      }));
    }
    centerConstellation();

    // Ғарыштағы жұмсақ жұлдыздар
    const bgStars = [];
    for (let i = 0; i < 90; i++) {
      bgStars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.5,
        alpha: Math.random()
      });
    }

    // Экранды басып кемені жүргізу (Саусақпен немесе тышқанмен)
    let touchTarget = null;

    function handlePointer(e) {
      // Егер төменгі батырмаларды баспаған болса
      if (!e.target.classList.contains('ctrl-btn') && e.target.tagName !== 'BUTTON') {
        const px = e.touches ? e.touches[0].clientX : e.clientX;
        const py = e.touches ? e.touches[0].clientY : e.clientY;
        touchTarget = { x: px, y: py };
      }
    }

    window.addEventListener("pointerdown", handlePointer);
    window.addEventListener("pointermove", (e) => { if (touchTarget) handlePointer(e); });
    window.addEventListener("pointerup", () => { touchTarget = null; });

    // Виртуалды батырмалар
    const setBtn = (id, prop) => {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => { e.stopPropagation(); ship[prop] = true; });
      el.addEventListener("pointerup", () => { ship[prop] = false; });
      el.addEventListener("pointerleave", () => { ship[prop] = false; });
    };
    setBtn("btnLeft", "rotateLeft");
    setBtn("btnRight", "rotateRight");
    setBtn("btnGas", "thrust");

    function closeCard() {
      infoCard.style.display = "none";
    }

    // Ойынның қозғалыс логикасы
    function update() {
      // 1. Саусақпен бағыттау
      if (touchTarget) {
        const dx = touchTarget.x - ship.x;
        const dy = touchTarget.y - ship.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 25) {
          const targetAngle = Math.atan2(dy, dx);
          let diff = targetAngle - ship.angle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          ship.angle += diff * 0.08;
          ship.speed = Math.min(ship.speed + 0.15, ship.maxSpeed);
          ship.thrust = true;
        } else {
          ship.thrust = false;
        }
      } else {
        // Батырмалармен басқару
        if (ship.rotateLeft) ship.angle -= 0.05;
        if (ship.rotateRight) ship.angle += 0.05;

        if (ship.thrust) {
          ship.speed = Math.min(ship.speed + 0.12, ship.maxSpeed);
        } else {
          ship.speed *= 0.94; // Жұмсақ тежелу
        }
      }

      ship.x += Math.cos(ship.angle) * ship.speed;
      ship.y += Math.sin(ship.angle) * ship.speed;

      // Экраннан шығып кетпеуін қадағалау
      if (ship.x < 20) ship.x = 20;
      if (ship.x > width - 20) ship.x = width - 20;
      if (ship.y < 20) ship.y = 20;
      if (ship.y > height - 20) ship.y = height - 20;

      // Жұлдызға жақындауды тексеру
      stars.forEach(star => {
        const d = Math.hypot(ship.x - star.x, ship.y - star.y);
        if (d < 30 && !star.visited) {
          star.visited = true;
          visitedCount++;
          starCountEl.innerText = `${visitedCount} / 7`;
          cardTitle.innerText = star.name;
          cardDesc.innerText = star.desc;
          infoCard.style.display = "block";
        }
      });

      draw();
      requestAnimationFrame(update);
    }

    // Графикалық бөлік (Көркемдеу)
    function draw() {
      // Терең ғарыш градиенті
      const grad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, width);
      grad.addColorStop(0, "#101636");
      grad.addColorStop(0.6, "#090d24");
      grad.addColorStop(1, "#040612");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Фондағы жымыңдаған ұсақ жұлдыздар
      bgStars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${0.3 + Math.sin(Date.now() * 0.002 + s.alpha * 10) * 0.3})`;
        ctx.fill();
      });

      // Жетіқарақшы шөмішінің байланыс сызықтары
      ctx.strokeStyle = "rgba(251, 191, 36, 0.25)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      // Шөміш қорабы
      ctx.moveTo(stars[0].x, stars[0].y);
      ctx.lineTo(stars[1].x, stars[1].y);
      ctx.lineTo(stars[2].x, stars[2].y);
      ctx.lineTo(stars[3].x, stars[3].y);
      ctx.lineTo(stars[0].x, stars[0].y);
      // Сабы
      ctx.moveTo(stars[3].x, stars[3].y);
      ctx.lineTo(stars[4].x, stars[4].y);
      ctx.lineTo(stars[5].x, stars[5].y);
      ctx.lineTo(stars[6].x, stars[6].y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 7 Жұлдызды салу
      stars.forEach(s => {
        // Жұлдыз сәулесі
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.visited ? 12 : 8, 0, Math.PI * 2);
        ctx.fillStyle = s.visited ? "#38bdf8" : "#fbbf24";
        ctx.shadowColor = s.visited ? "#38bdf8" : "#fbbf24";
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Жұлдыз атауы
        ctx.font = "12px sans-serif";
        ctx.fillStyle = s.visited ? "#7dd3fc" : "#fde68a";
        ctx.fillText(s.name.split(' ')[1], s.x + 12, s.y + 4);
      });

      // Ойыншының шағын Сандық-кемесі
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle + Math.PI / 2);

      // Қозғалтқыштың оты (Тек ұшқанда)
      if (ship.thrust || ship.speed > 0.8) {
        ctx.fillStyle = "#38bdf8";
        ctx.shadowColor = "#38bdf8";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(-5, 14);
        ctx.lineTo(5, 14);
        ctx.lineTo(0, 24 + Math.random() * 6);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Сандықтың корпусы
      ctx.fillStyle = "#2d1607";
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 1.8;
      ctx.fillRect(-12, -15, 24, 30);
      ctx.strokeRect(-12, -15, 24, 30);

      // Сандықтың алтын қақпағы мен ою сызықтары
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(-12, -2, 24, 3);
      ctx.beginPath();
      ctx.arc(0, -1, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    update();
  </script>
</body>
</html>
