<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Zhetiqaraqshy — Сандық-кеме</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #030712;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #fbbf24;
    }

    /* 1. Ғарыш кенебі (Canvas) */
    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* 2. Кеменің басқару кабинасы (Cockpit) */
    .cockpit {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 18px solid #27170a; /* Сандықтың көне ағаш түстес жақтауы */
      outline: 4px solid #d97706;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(217, 119, 6, 0.3);
    }

    /* Сандықтың қазақи оюларымен безендірілген бұрыштары */
    .ornament-corner {
      position: absolute;
      width: 120px;
      height: 120px;
      fill: none;
      stroke: #f59e0b;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px #f59e0b);
    }
    .top-left { top: 10px; left: 10px; }
    .top-right { top: 10px; right: 10px; transform: scaleX(-1); }
    .bottom-left { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .bottom-right { bottom: 10px; right: 10px; transform: scale(-1); }

    /* Жоғарғы бақылау панелі */
    .top-panel {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(20, 10, 5, 0.85) 0%, transparent 100%);
      pointer-events: auto;
    }

    .ship-status {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #f59e0b;
    }

    /* Орталық нысана (Көздеуіш / Тор) */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(245, 158, 11, 0.7);
    }
    .crosshair::before { width: 100%; height: 1px; }
    .crosshair::after { width: 1px; height: 100%; }

    /* Төменгі сандық-басқару панелі */
    .bottom-panel {
      padding: 30px;
      background: linear-gradient(0deg, rgba(20, 10, 5, 0.95) 0%, rgba(20, 10, 5, 0.6) 70%, transparent 100%);
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: auto;
      border-top: 1px solid rgba(245, 158, 11, 0.3);
    }

    .nav-btn {
      background: rgba(40, 20, 10, 0.8);
      border: 1px solid #d97706;
      color: #fde68a;
      padding: 12px 24px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(217, 119, 6, 0.2);
    }

    .nav-btn:hover {
      background: #d97706;
      color: #000;
      box-shadow: 0 0 20px #f59e0b;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- 1. Математикалық ғарыш кенебі -->
  <canvas id="spaceCanvas"></canvas>

  <!-- 2. Кеме/Сандық интерьері -->
  <div class="cockpit">
    
    <!-- Қазақи «Қошқар мүйіз» оюы (SVG) -->
    <svg class="ornament-corner top-left" viewBox="0 0 100 100">
      <path d="M 10,10 L 80,10 C 60,30 40,20 40,40 C 40,60 60,60 60,40 C 60,30 50,30 50,40 C 50,45 55,45 55,40 C 55,25 25,25 25,50 C 25,75 50,75 50,60 L 10,60 Z" />
    </svg>
    <svg class="ornament-corner top-right" viewBox="0 0 100 100">
      <path d="M 10,10 L 80,10 C 60,30 40,20 40,40 C 40,60 60,60 60,40 C 60,30 50,30 50,40 C 50,45 55,45 55,40 C 55,25 25,25 25,50 C 25,75 50,75 50,60 L 10,60 Z" />
    </svg>
    <svg class="ornament-corner bottom-left" viewBox="0 0 100 100">
      <path d="M 10,10 L 80,10 C 60,30 40,20 40,40 C 40,60 60,60 60,40 C 60,30 50,30 50,40 C 50,45 55,45 55,40 C 55,25 25,25 25,50 C 25,75 50,75 50,60 L 10,60 Z" />
    </svg>
    <svg class="ornament-corner bottom-right" viewBox="0 0 100 100">
      <path d="M 10,10 L 80,10 C 60,30 40,20 40,40 C 40,60 60,60 60,40 C 60,30 50,30 50,40 C 50,45 55,45 55,40 C 55,25 25,25 25,50 C 25,75 50,75 50,60 L 10,60 Z" />
    </svg>

    <!-- Жоғарғы мәліметтер тақтасы -->
    <div class="top-panel">
      <div class="ship-status">БОРТ: «ЖЕТІҚАРАҚШЫ-1»</div>
      <div class="ship-status" id="speedMeter">ЖЫЛДАМДЫҚ: 1.0 MАХ</div>
      <div class="ship-status">БАҒЫТ: ТЕМІРҚАЗЫҚ</div>
    </div>

    <!-- Орталық көздеуіш -->
    <div class="crosshair"></div>

    <!-- Төменгі танымдық түймелер панелі -->
    <div class="bottom-panel">
      <button class="nav-btn" onclick="alert('Темірқазық — аспанның мызғымас кіндігі.')">Темірқазық</button>
      <button class="nav-btn" onclick="alert('Жетіқарақшы — бағдар сілтеуші шоқжұлдыз.')">Жетіқарақшы</button>
      <button class="nav-btn" onclick="alert('Ақбозат пен Көкбозат — арқандаулы қос жұлдыз.')">Ақбозат & Көкбозат</button>
      <button class="nav-btn" onclick="alert('Борт журналы — ғарыштық танымдық деректер.')">Борт журналы</button>
    </div>

  </div>

  <!-- 3. Таза математикалық анимация скрипті -->
  <script>
    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");
    const speedMeter = document.getElementById("speedMeter");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Ғарыштағы жұлдыздар саны мен бастапқы координаталары
    const STAR_COUNT = 600;
    let speed = 4;
    let targetSpeed = 4;
    let mouseX = 0;
    let mouseY = 0;

    const stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: (Math.random() - 0.5) * width * 2,
        y: (Math.random() - 0.5) * height * 2,
        z: Math.random() * width, // Тереңдік осі
        origZ: Math.random() * width
      });
    }

    // Тінтуір қозғалысын есептеу
    window.addEventListener("mousemove", (e) => {
      mouseX = (e.clientX - width / 2) * 0.05;
      mouseY = (e.clientY - height / 2) * 0.05;
    });

    // Жылдамдықты W/S немесе бағыттауыш пернелермен өзгерту
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "w") targetSpeed = Math.min(targetSpeed + 2, 25);
      if (e.key === "ArrowDown" || e.key === "s") targetSpeed = Math.max(targetSpeed - 2, 0.5);
    });

    // Негізгі математикалық жаңарту циклі
    function render() {
      // Инерциямен жұмсақ жылдамдату
      speed += (targetSpeed - speed) * 0.05;
      speedMeter.innerText = `ЖЫЛДАМДЫҚ: ${(speed * 0.5).toFixed(1)} МАХ`;

      // Артқы фонды тегіс өшіру арқылы жарық ізін (motion blur) шығару
      ctx.fillStyle = "rgba(3, 7, 18, 0.35)";
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      for (let i = 0; i < STAR_COUNT; i++) {
        const star = stars[i];

        // Тереңдік бойынша жылжыту
        star.z -= speed;

        if (star.z <= 0) {
          star.z = width;
          star.x = (Math.random() - 0.5) * width * 2;
          star.y = (Math.random() - 0.5) * height * 2;
        }

        // 3D проекция математикасы: z кішірейген сайын x пен y экранға қарай үлкейеді
        const k = 250 / star.z;
        const px = (star.x - mouseX * star.z * 0.01) * k + cx;
        const py = (star.y - mouseY * star.z * 0.01) * k + cy;

        // Экраннан шығып кетсе қайта салу
        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          const size = Math.max((1 - star.z / width) * 3, 0.6);
          const alpha = 1 - star.z / width;

          ctx.beginPath();
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`; // Алтын-сары жұлдыздар
          ctx.fill();
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
