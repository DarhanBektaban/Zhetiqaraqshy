<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zhetiqaraqshy 3D — Сандық Саяхаты</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body { background: #02040a; overflow: hidden; font-family: -apple-system, sans-serif; color: #fef08a; }
    #canvas3d { position: absolute; inset: 0; width: 100vw; height: 100vh; }
    
    /* Жоғарғы бағдаршам мен компас */
    .hud-top {
      position: absolute; top: 12px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; pointer-events: none; z-index: 10;
    }
    .badge {
      background: rgba(10, 16, 38, 0.88);
      border: 1px solid rgba(251, 191, 36, 0.5);
      backdrop-filter: blur(10px);
      padding: 6px 16px; border-radius: 20px; font-size: 13px;
    }
    .compass-hint {
      background: rgba(18, 26, 56, 0.85);
      border: 1px solid #fbbf24;
      padding: 5px 14px; border-radius: 12px; font-size: 12px;
      color: #38bdf8; font-weight: bold;
      display: flex; align-items: center; gap: 8px;
    }

    /* Басқару интерфейсі (Мобильді + Компьютер) */
    .controls {
      position: absolute; bottom: 15px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 15px;
      z-index: 10; pointer-events: none;
    }
    .btn-group { display: flex; gap: 8px; pointer-events: auto; }
    .col-group { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    
    .c-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(18, 26, 56, 0.85); border: 2px solid #fbbf24;
      color: #fef08a; font-size: 18px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .c-btn:active { background: #fbbf24; color: #000; transform: scale(0.92); }
    .gas-btn { width: 68px; border-radius: 24px; font-size: 12px; font-weight: bold; }
    .vert-btn { width: 48px; height: 42px; border-radius: 12px; font-size: 11px; font-weight: bold; }

    #infoModal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(12, 18, 40, 0.96); backdrop-filter: blur(14px);
      border: 2px solid #fbbf24; border-radius: 16px; padding: 22px;
      width: 88%; max-width: 360px; text-align: center; display: none; z-index: 50;
    }
    #infoModal h3 { color: #fbbf24; font-size: 18px; margin-bottom: 8px; }
    #infoModal p { color: #e2e8f0; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    #infoModal button {
      background: #fbbf24; border: none; color: #050816; font-weight: bold;
      padding: 8px 24px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas3d"></div>

  <!-- Бағдаршам / Компас (Адастырмас үшін) -->
  <div class="hud-top">
    <div class="badge">✨ 3D Зерттеу: <strong id="counterText" style="color: #38bdf8;">0 / 7</strong></div>
    <div class="compass-hint" id="compassHint">🧭 БАҒЫТ: 1. Күш (200м)</div>
  </div>

  <div id="infoModal">
    <h3 id="modalTitle">Жұлдыз</h3>
    <p id="modalDesc">Мәлімет...</p>
    <button onclick="closeModal()">Сапарды жалғастыру</button>
  </div>

  <!-- 3D Толық басқару: Оң/Сол, Жоғары/Төмен, Ұшу -->
  <div class="controls">
    <div class="btn-group">
      <div class="c-btn" id="leftBtn">◄</div>
      <div class="c-btn" id="rightBtn">►</div>
    </div>
    
    <!-- Жоғары / Төмен биіктік батырмалары -->
    <div class="col-group">
      <div class="c-btn vert-btn" id="upBtn">▲ ҮСТІ</div>
      <div class="c-btn vert-btn" id="downBtn">▼ АСТЫ</div>
    </div>

    <div class="btn-group">
      <div class="c-btn gas-btn" id="gasBtn">ҰШУ</div>
    </div>
  </div>

  <script>
    // 1. САХНА ЖӘНЕ КАМЕРА
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030614, 0.0012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById("canvas3d").appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xfef08a, 1.4);
    sunLight.position.set(60, 100, 40);
    scene.add(sunLight);

    // 2. ҚАЗАҚИ «ҚОШҚАР МҮЙІЗ» ОЮЫ БАР АЛТЫН ТЕКСТУРА ЖАСАУ (Программалық)
    function createOrnamentTexture() {
      const cvs = document.createElement("canvas");
      cvs.width = 512;
      cvs.height = 512;
      const c = cvs.getContext("2d");

      // Көне жылтыр қара-қоңыр ағаш негіз
      c.fillStyle = "#2c1404";
      c.fillRect(0, 0, 512, 512);

      // Алтын жақтау
      c.strokeStyle = "#fbbf24";
      c.lineWidth = 14;
      c.strokeRect(10, 10, 492, 492);

      // Орталық «Қошқар мүйіз» оюы
      c.strokeStyle = "#fbbf24";
      c.lineWidth = 16;
      c.lineCap = "round";

      c.translate(256, 256);
      for (let rot = 0; rot < 2; rot++) {
        c.rotate(Math.PI);
        // Сол мүйіз
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(-50, -80, -140, -80, -140, -10);
        c.bezierCurveTo(-140, 50, -80, 50, -80, 10);
        c.bezierCurveTo(-80, -20, -110, -20, -110, -10);
        c.stroke();

        // Оң мүйіз
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(50, -80, 140, -80, 140, -10);
        c.bezierCurveTo(140, 50, 80, 50, 80, 10);
        c.bezierCurveTo(80, -20, 110, -20, 110, -10);
        c.stroke();
      }

      return new THREE.CanvasTexture(cvs);
    }

    const ornamentTex = createOrnamentTexture();

    // 3. 3D ОЮЛЫ САНДЫҚ-КЕМЕ
    const shipGroup = new THREE.Group();

    // Сандық қақпағында оюы бар материал
    const chestMats = [
      new THREE.MeshStandardMaterial({ map: ornamentTex, roughness: 0.4 }), // Оң
      new THREE.MeshStandardMaterial({ map: ornamentTex, roughness: 0.4 }), // Сол
      new THREE.MeshStandardMaterial({ map: ornamentTex, roughness: 0.3, metalness: 0.2 }), // ҮСТІ (ОЮ)
      new THREE.MeshStandardMaterial({ color: 0x1f0c02 }), // Асты
      new THREE.MeshStandardMaterial({ map: ornamentTex, roughness: 0.4 }), // Алды
      new THREE.MeshStandardMaterial({ color: 0x1f0c02 })  // Арты
    ];
    const chestMesh = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 3.4), chestMats);
    shipGroup.add(chestMesh);

    // Алтын оюлы қанаттар
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.8, roughness: 0.3 });
    const wingGeo = new THREE.BoxGeometry(1.8, 0.1, 1.4);
    const leftWing = new THREE.Mesh(wingGeo, goldMat);
    leftWing.position.set(-1.9, 0, 0.3);
    leftWing.rotation.z = -0.15;
    shipGroup.add(leftWing);

    const rightWing = new THREE.Mesh(wingGeo, goldMat);
    rightWing.position.set(1.9, 0, 0.3);
    rightWing.rotation.z = 0.15;
    shipGroup.add(rightWing);

    // Қос қозғалтқыштың плазмасы
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const flameGeo = new THREE.ConeGeometry(0.32, 1.4, 8);
    flameGeo.rotateX(-Math.PI / 2);

    const leftFlame = new THREE.Mesh(flameGeo, flameMat);
    leftFlame.position.set(-0.7, 0, 2.3);
    shipGroup.add(leftFlame);

    const rightFlame = new THREE.Mesh(flameGeo, flameMat);
    rightFlame.position.set(0.7, 0, 2.3);
    shipGroup.add(rightFlame);

    scene.add(shipGroup);
    shipGroup.position.set(0, 0, 110);

    // 4. ТЕМІРҚАЗЫҚ ЖӘНЕ ЖЕТІҚАРАҚШЫ (3D ЖҰЛДЫЗДАР)
    const starSpheres = [];
    const rawStars = [
      { name: "1. Күш", x: -60, y: 15, z: 20, desc: "Шөміштің шеткі күзетшісі. Жігермен бірге Темірқазықты тура көрсетеді." },
      { name: "2. Жігер", x: -65, y: 0, z: -25, desc: "Шөміштің түбіндегі орнықты жұлдыз. Бағдар нұсқаушы." },
      { name: "3. Қайрат", x: -20, y: -10, z: -30, desc: "Шөміш табағының мықты тұғыры." },
      { name: "4. Қуат", x: -15, y: 10, z: 15, desc: "Ожау мен сапты байланыстырып тұрған қуатты түйін." },
      { name: "5. Ырық", x: 25, y: 5, z: 30, desc: "Саптың бастауы, шоқтың ең жарық әрі ырықты жұлдызы." },
      { name: "6. Ерік", x: 60, y: 18, z: 50, desc: "Сап ортасы. Қасында Балапан жұлдызы бар." },
      { name: "7. Дес (Шұнақ)", x: 95, y: 25, z: 75, desc: "Саптың ең ұшы. Түнгі мезгілді өлшейтін аспан сағаты." }
    ];

    const starSphereGeo = new THREE.SphereGeometry(2.6, 16, 16);
    rawStars.forEach(s => {
      const sphere = new THREE.Mesh(starSphereGeo, new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
      sphere.position.set(s.x, s.y, s.z);
      scene.add(sphere);
      starSpheres.push({ mesh: sphere, data: s, visited: false });
    });

    // Шөміш сызықтары
    const lineMat = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.35 });
    const linePoints = [
      new THREE.Vector3(rawStars[0].x, rawStars[0].y, rawStars[0].z),
      new THREE.Vector3(rawStars[1].x, rawStars[1].y, rawStars[1].z),
      new THREE.Vector3(rawStars[2].x, rawStars[2].y, rawStars[2].z),
      new THREE.Vector3(rawStars[3].x, rawStars[3].y, rawStars[3].z),
      new THREE.Vector3(rawStars[0].x, rawStars[0].y, rawStars[0].z),
      new THREE.Vector3(rawStars[3].x, rawStars[3].y, rawStars[3].z),
      new THREE.Vector3(rawStars[4].x, rawStars[4].y, rawStars[4].z),
      new THREE.Vector3(rawStars[5].x, rawStars[5].y, rawStars[5].z),
      new THREE.Vector3(rawStars[6].x, rawStars[6].y, rawStars[6].z),
    ];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePoints), lineMat));

    // Темірқазық (Үлкен алтын шамшырақ)
    const poleMesh = new THREE.Mesh(new THREE.SphereGeometry(4.5, 20, 20), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
    poleMesh.position.set(-60, 30, 115);
    scene.add(poleMesh);

    // Ғарыш тозаңы фоны
    const starCoords = [];
    for(let i=0; i<1200; i++) {
      starCoords.push((Math.random()-0.5)*1000, (Math.random()-0.5)*500, (Math.random()-0.5)*1000);
    }
    const bgGeo = new THREE.BufferGeometry();
    bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0xfef08a, size: 1.5, transparent: true, opacity: 0.7 })));

    // 5. ТОЛЫҚ БАСҚАРУ ЖӘНЕ НАВИГАЦИЯ
    let speed = 0;
    let turnAngle = 0;   // Сол/Оң (Yaw)
    let pitchAngle = 0;  // Жоғары/Төмен (Pitch)
    let rollAngle = 0;   // Қисаю (Roll)

    let isThrusting = false;
    let turnLeft = false, turnRight = false;
    let moveUp = false, moveDown = false;
    let visitedCount = 0;
    let isPaused = false;

    // Пернетақта
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a") turnLeft = true;
      if (k === "arrowright" || k === "d") turnRight = true;
      if (k === "arrowup" || k === "w") isThrusting = true;
      if (k === "r" || k === "shift") moveUp = true;
      if (k === "f" || k === "control") moveDown = true;
    });
    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a") turnLeft = false;
      if (k === "arrowright" || k === "d") turnRight = false;
      if (k === "arrowup" || k === "w") isThrusting = false;
      if (k === "r" || k === "shift") moveUp = false;
      if (k === "f" || k === "control") moveDown = false;
    });

    // Экрандағы сенсор батырмалар
    const bindBtn = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => { e.stopPropagation(); onDown(); });
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointerleave", onUp);
    };
    bindBtn("leftBtn", () => turnLeft = true, () => turnLeft = false);
    bindBtn("rightBtn", () => turnRight = true, () => turnRight = false);
    bindBtn("upBtn", () => moveUp = true, () => moveUp = false);
    bindBtn("downBtn", () => moveDown = true, () => moveDown = false);
    bindBtn("gasBtn", () => isThrusting = true, () => isThrusting = false);

    function closeModal() {
      document.getElementById("infoModal").style.display = "none";
      isPaused = false;
    }

    // 6. ОЙЫН ЦИКЛІ ЖӘНЕ КОМПАС
    function animate() {
      requestAnimationFrame(animate);

      if (!isPaused) {
        // Оңға / Солға бұрылу
        if (turnLeft) {
          turnAngle += 0.03;
          rollAngle = THREE.MathUtils.lerp(rollAngle, 0.4, 0.1);
        } else if (turnRight) {
          turnAngle -= 0.03;
          rollAngle = THREE.MathUtils.lerp(rollAngle, -0.4, 0.1);
        } else {
          rollAngle = THREE.MathUtils.lerp(rollAngle, 0, 0.1);
        }

        // Жоғары / Төмен еңкею (Pitch)
        if (moveUp) {
          pitchAngle = THREE.MathUtils.lerp(pitchAngle, 0.35, 0.08);
          shipGroup.position.y += 0.4;
        } else if (moveDown) {
          pitchAngle = THREE.MathUtils.lerp(pitchAngle, -0.35, 0.08);
          shipGroup.position.y -= 0.4;
        } else {
          pitchAngle = THREE.MathUtils.lerp(pitchAngle, 0, 0.08);
        }

        // Ұшу жылдамдығы
        if (isThrusting) {
          speed = THREE.MathUtils.lerp(speed, 1.3, 0.06);
          leftFlame.scale.set(1, 2 + Math.random()*0.4, 1);
          rightFlame.scale.set(1, 2 + Math.random()*0.4, 1);
        } else {
          speed = THREE.MathUtils.lerp(speed, 0.08, 0.03);
          leftFlame.scale.set(0.5, 0.5, 0.5);
          rightFlame.scale.set(0.5, 0.5, 0.5);
        }

        // Кеменің координатасын бағытқа сай алға жылжыту
        shipGroup.position.x -= Math.sin(turnAngle) * speed;
        shipGroup.position.z -= Math.cos(turnAngle) * speed;

        // Кеменің 3D ротациясын орнату
        shipGroup.rotation.set(pitchAngle, turnAngle, rollAngle, 'YXZ');

        // Камера кеменің артынан ілеседі
        camera.position.x = shipGroup.position.x + Math.sin(turnAngle) * 20;
        camera.position.z = shipGroup.position.z + Math.cos(turnAngle) * 20;
        camera.position.y = shipGroup.position.y + 8 - pitchAngle * 8;
        camera.lookAt(shipGroup.position.x, shipGroup.position.y + 1, shipGroup.position.z);

        // КЕЛЕСІ АШЫЛМАҒАН ЖҰЛДЫЗҒА АДАСТЫРМАЙТЫН КОМПАС ЕСЕПТЕУ
        const nextStar = starSpheres.find(s => !s.visited);
        if (nextStar) {
          const dist = Math.round(shipGroup.position.distanceTo(nextStar.mesh.position));
          document.getElementById("compassHint").innerText = `🧭 БАҒЫТ: ${nextStar.data.name} (${dist} қашықтық)`;
        } else {
          document.getElementById("compassHint").innerText = `🎉 Барлық жұлдыз зерттелді!`;
        }

        // Жұлдызға жақындауды тексеру
        starSpheres.forEach(s => {
          const dist = shipGroup.position.distanceTo(s.mesh.position);
          if (dist < 9 && !s.visited) {
            s.visited = true;
            s.mesh.material.color.setHex(0x38bdf8);
            visitedCount++;
            document.getElementById("counterText").innerText = `${visitedCount} / 7`;
            isPaused = true;
            document.getElementById("modalTitle").innerText = s.data.name;
            document.getElementById("modalDesc").innerText = s.data.desc;
            document.getElementById("infoModal").style.display = "block";
          }
        });
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
