<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zhetiqaraqshy 3D — Сандық Саяхаты</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body { background: #02040a; overflow: hidden; font-family: -apple-system, sans-serif; color: #fef08a; }
    #canvas3d { position: absolute; inset: 0; width: 100vw; height: 100vh; }
    
    .hud {
      position: absolute; top: 15px; left: 0; right: 0;
      display: flex; justify-content: center; pointer-events: none; z-index: 10;
    }
    .badge {
      background: rgba(10, 16, 38, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.5);
      backdrop-filter: blur(10px);
      padding: 8px 18px; border-radius: 20px; font-size: 13px;
    }

    .controls {
      position: absolute; bottom: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 25px;
      z-index: 10; pointer-events: none;
    }
    .btn-row { display: flex; gap: 12px; pointer-events: auto; }
    .c-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(18, 26, 56, 0.85); border: 2px solid #fbbf24;
      color: #fef08a; font-size: 20px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .c-btn:active { background: #fbbf24; color: #000; transform: scale(0.92); }
    .gas-btn { width: 76px; border-radius: 28px; font-size: 13px; font-weight: bold; }

    #infoModal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(12, 18, 40, 0.95); backdrop-filter: blur(14px);
      border: 1.5px solid #fbbf24; border-radius: 16px; padding: 20px;
      width: 88%; max-width: 360px; text-align: center; display: none; z-index: 50;
    }
    #infoModal h3 { color: #fbbf24; font-size: 18px; margin-bottom: 8px; }
    #infoModal p { color: #e2e8f0; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    #infoModal button {
      background: #fbbf24; border: none; color: #050816; font-weight: bold;
      padding: 8px 22px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }
  </style>
  <!-- Three.js 3D қозғалтқышы (CDN арқылы жылдам жүктеледі) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas3d"></div>

  <div class="hud">
    <div class="badge">✨ 3D Зерттеу: <strong id="counterText" style="color: #38bdf8;">0 / 7</strong></div>
  </div>

  <div id="infoModal">
    <h3 id="modalTitle">Жұлдыз</h3>
    <p id="modalDesc">Мәлімет...</p>
    <button onclick="closeModal()">Сапарды жалғастыру</button>
  </div>

  <div class="controls">
    <div class="btn-row">
      <div class="c-btn" id="leftBtn">◄</div>
      <div class="c-btn" id="rightBtn">►</div>
    </div>
    <div class="btn-row">
      <div class="c-btn gas-btn" id="gasBtn">ҰШУ</div>
    </div>
  </div>

  <script>
    // 1. THREE.JS 3D САХНАСЫ
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x040714, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById("canvas3d").appendChild(renderer.domElement);

    // Жарықтандыру
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xfef08a, 1.2);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // 2. 3D САНДЫҚ-КЕМЕНІ ҚҰРАСТЫРУ
    const shipGroup = new THREE.Group();

    // Сандықтың ағаш негізі
    const chestGeo = new THREE.BoxGeometry(2.4, 1.6, 3.4);
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x3d1d06, roughness: 0.6, metalness: 0.2 });
    const chestMesh = new THREE.Mesh(chestGeo, woodMat);
    shipGroup.add(chestMesh);

    // Алтын құрсаулар (Белдіктер)
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.8, roughness: 0.3 });
    const ringGeo = new THREE.BoxGeometry(2.45, 1.65, 0.4);
    const ringMesh = new THREE.Mesh(ringGeo, goldMat);
    shipGroup.add(ringMesh);

    // Сандықтың оюлы алтын қанаттары (Екі бүйірінде)
    const wingGeo = new THREE.BoxGeometry(1.6, 0.1, 1.4);
    const leftWing = new THREE.Mesh(wingGeo, goldMat);
    leftWing.position.set(-1.8, 0, 0.3);
    leftWing.rotation.z = -0.2;
    shipGroup.add(leftWing);

    const rightWing = new THREE.Mesh(wingGeo, goldMat);
    rightWing.position.set(1.8, 0, 0.3);
    rightWing.rotation.z = 0.2;
    shipGroup.add(rightWing);

    // Қос қозғалтқыш оттары
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const flameGeo = new THREE.ConeGeometry(0.3, 1.2, 8);
    flameGeo.rotateX(-Math.PI / 2);

    const leftFlame = new THREE.Mesh(flameGeo, flameMat);
    leftFlame.position.set(-0.7, 0, 2.2);
    shipGroup.add(leftFlame);

    const rightFlame = new THREE.Mesh(flameGeo, flameMat);
    rightFlame.position.set(0.7, 0, 2.2);
    shipGroup.add(rightFlame);

    scene.add(shipGroup);
    shipGroup.position.set(0, 0, 120);

    // 3. ҒАРЫШТАҒЫ ЖҰЛДЫЗДАР ТОЗАҢЫ (Фон)
    const starCount = 1200;
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<starCount; i++) {
      starCoords.push(
        (Math.random() - 0.5) * 1000,
        (Math.random() - 0.5) * 600,
        (Math.random() - 0.5) * 1000
      );
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xfef08a, size: 1.6, transparent: true, opacity: 0.8 });
    const bgStarField = new THREE.Points(starGeo, starMat);
    scene.add(bgStarField);

    // 4. ТЕМІРҚАЗЫҚ ПЕН ЖЕТІҚАРАҚШЫ 3D ЖҰЛДЫЗДАРЫ
    const starSpheres = [];
    const rawStars = [
      { name: "1. Күш", x: -60, y: 15, z: 20, desc: "Шөміштің шеткі күзетшісі. Жігермен бірге Темірқазықты тура көрсетеді." },
      { name: "2. Жігер", x: -65, y: 10, z: -25, desc: "Шөміштің түбіндегі орнықты жұлдыз. Бағдар нұсқаушы." },
      { name: "3. Қайрат", x: -20, y: 5, z: -30, desc: "Шөміш табағының мықты тұғыры." },
      { name: "4. Қуат", x: -15, y: 12, z: 15, desc: "Ожау мен сапты байланыстырып тұрған қуатты түйін." },
      { name: "5. Ырық", x: 25, y: 8, z: 30, desc: "Саптың бастауы, шоқтың ең жарық әрі ырықты жұлдызы." },
      { name: "6. Ерік", x: 60, y: 14, z: 50, desc: "Сап ортасы. Қасында Балапан жұлдызы бар." },
      { name: "7. Дес (Шұнақ)", x: 95, y: 20, z: 75, desc: "Саптың ең ұшы. Түнгі мезгілді өлшейтін аспан сағаты." }
    ];

    const starSphereGeo = new THREE.SphereGeometry(2.5, 16, 16);
    rawStars.forEach(s => {
      const mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
      const sphere = new THREE.Mesh(starSphereGeo, mat);
      sphere.position.set(s.x, s.y, s.z);
      scene.add(sphere);
      starSpheres.push({ mesh: sphere, data: s, visited: false });
    });

    // Шөміш сызығын 3D сызу
    const lineMat = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.35 });
    const linePoints = [
      new THREE.Vector3(rawStars[0].x, rawStars[0].y, rawStars[0].z),
      new THREE.Vector3(rawStars[1].x, rawStars[1].y, rawStars[1].z),
      new THREE.Vector3(rawStars[2].x, rawStars[2].y, rawStars[2].z),
      new THREE.Vector3(rawStars[3].x, rawStars[3].y, rawStars[3].z),
      new THREE.Vector3(rawStars[0].x, rawStars[0].y, rawStars[0].z),
      new THREE.Vector3(rawStars[3].x, rawStars[3].y, rawStars[3].z),
      new THREE.Vector3(rawStars[4].x, rawStars[4].y, rawStars[4].z),
      new THREE.Vector3(rawStars[5].x, rawStars[5].y, rawStars[5].z),
      new THREE.Vector3(rawStars[6].x, rawStars[6].y, rawStars[6].z),
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
    scene.add(new THREE.Line(lineGeo, lineMat));

    // Темірқазық (Үлкен алтын шар)
    const poleMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const poleMesh = new THREE.Mesh(new THREE.SphereGeometry(4, 20, 20), poleMat);
    poleMesh.position.set(-60, 25, 120);
    scene.add(poleMesh);

    // 5. БАСҚАРУ ЖӘНЕ ФИЗИКА
    let speed = 0;
    let turnAngle = 0;
    let rollAngle = 0;
    let isThrusting = false;
    let turnLeft = false;
    let turnRight = false;
    let visitedCount = 0;
    let isPaused = false;

    // Пернетақта
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") turnLeft = true;
      if (e.key === "ArrowRight" || e.key === "d") turnRight = true;
      if (e.key === "ArrowUp" || e.key === "w") isThrusting = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") turnLeft = false;
      if (e.key === "ArrowRight" || e.key === "d") turnRight = false;
      if (e.key === "ArrowUp" || e.key === "w") isThrusting = false;
    });

    // Экрандағы батырмалар
    const bindBtn = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => { e.stopPropagation(); onDown(); });
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointerleave", onUp);
    };
    bindBtn("leftBtn", () => turnLeft = true, () => turnLeft = false);
    bindBtn("rightBtn", () => turnRight = true, () => turnRight = false);
    bindBtn("gasBtn", () => isThrusting = true, () => isThrusting = false);

    function closeModal() {
      document.getElementById("infoModal").style.display = "none";
      isPaused = false;
    }

    // 6. НЕГІЗГІ ОЙЫН ЦИКЛІ
    function animate() {
      requestAnimationFrame(animate);

      if (!isPaused) {
        // Бұрылу және 3D қисаю (Bank roll)
        if (turnLeft) {
          turnAngle += 0.03;
          rollAngle = THREE.MathUtils.lerp(rollAngle, 0.4, 0.1);
        } else if (turnRight) {
          turnAngle -= 0.03;
          rollAngle = THREE.MathUtils.lerp(rollAngle, -0.4, 0.1);
        } else {
          rollAngle = THREE.MathUtils.lerp(rollAngle, 0, 0.1);
        }

        // Жылдамдық
        if (isThrusting) {
          speed = THREE.MathUtils.lerp(speed, 1.2, 0.05);
          leftFlame.scale.set(1, 1.8 + Math.random()*0.5, 1);
          rightFlame.scale.set(1, 1.8 + Math.random()*0.5, 1);
        } else {
          speed = THREE.MathUtils.lerp(speed, 0.1, 0.03);
          leftFlame.scale.set(0.6, 0.6, 0.6);
          rightFlame.scale.set(0.6, 0.6, 0.6);
        }

        // Кеменің координатасын бағытқа сай алға жылжыту
        shipGroup.position.x -= Math.sin(turnAngle) * speed;
        shipGroup.position.z -= Math.cos(turnAngle) * speed;

        // Кеменің 3D ротациясы
        shipGroup.rotation.y = turnAngle;
        shipGroup.rotation.z = rollAngle;

        // Камера кеменің артынан 3D еріп отырады
        camera.position.x = shipGroup.position.x + Math.sin(turnAngle) * 22;
        camera.position.z = shipGroup.position.z + Math.cos(turnAngle) * 22;
        camera.position.y = shipGroup.position.y + 9;
        camera.lookAt(shipGroup.position.x, shipGroup.position.y + 1, shipGroup.position.z);

        // Жұлдызға жақындауды тексеру
        starSpheres.forEach(s => {
          const dist = shipGroup.position.distanceTo(s.mesh.position);
          if (dist < 8 && !s.visited) {
            s.visited = true;
            s.mesh.material.color.setHex(0x38bdf8); // Көгілдір болып жанады
            visitedCount++;
            document.getElementById("counterText").innerText = `${visitedCount} / 7`;
            isPaused = true;
            document.getElementById("modalTitle").innerText = s.data.name;
            document.getElementById("modalDesc").innerText = s.data.desc;
            document.getElementById("infoModal").style.display = "block";
          }
        });
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
